name: determinism

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runs:
        description: Captures to compare
        default: '10'
      flags:
        description: Extra rig flags, e.g. --no-wait-for-network-idle (bisecting)
        default: ''

jobs:
  checks:
    # Pinned runner image, not ubuntu-latest: the image supplies system fonts
    # and graphics libraries, and a silent image bump changes rendering.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  rig:
    runs-on: ubuntu-24.04
    # Non-blocking while capture and its core-ui fixture share a repo. Otherwise
    # a capture bug fails the design system's check, a design system change
    # fails capture's check, and the build deadlocks with no obvious culprit.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @snapcheck/capture exec playwright install --with-deps chromium
      - name: Determinism rig
        env:
          RUNS: ${{ inputs.runs || '10' }}
          # Unquoted in the command below so multiple flags split into
          # arguments. Only repo writers can dispatch a workflow, and the value
          # arrives as an environment variable rather than interpolated into
          # the script.
          FLAGS: ${{ inputs.flags || '' }}
        # The runner applies the harness by default; --no-<flag> turns one off
        # to bisect. Waiting for the story to render is unconditional.
        run: pnpm rig:determinism --runs "$RUNS" $FLAGS
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: determinism-rig
          path: .snapcheck/rig
          retention-days: 7

  snapshot:
    runs-on: ubuntu-24.04
    # Non-blocking for the same reason as the rig: while capture and its
    # core-ui fixture share a repo, a capture bug would fail the design
    # system's check and a design system change would fail capture's, and the
    # build can deadlock with no obvious culprit.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @snapcheck/capture exec playwright install --with-deps chromium
      # Baselines are gitignored, so every CI run starts with none: this writes
      # new baselines and exits 0 with a warning. It proves the full loop runs,
      # not that nothing changed. Real regression checking arrives with the
      # review server at M1.
      - name: Snapshot
        run: pnpm snapshot
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-run
          path: .snapcheck/runs
          retention-days: 7
